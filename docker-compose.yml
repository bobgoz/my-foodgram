services:
  db:
    image: postgres:15-alpine
    container_name: foodgram_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      - foodgram_network

  backend:
    build:
      context: .
      dockerfile: src/async_foodgram/Dockerfile
    container_name: backend
    restart: unless-stopped
    depends_on:
      - db
        # condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://test:test@db:5432/test
      
    volumes:
      - static:/async_foodgram/static
      - media:/async_foodgram/media
    networks:
      - foodgram_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    command: cp -r /app/build/. /static/

    volumes:
      - static:/static
    # restart: unless-stopped
    networks:
      - foodgram_network

  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/static
      - media:/media
    depends_on:
      - frontend
      - backend
    networks:
      - foodgram_network

volumes:
  postgres_data:
  static:
  media:

networks:
  foodgram_network:
    driver: bridge